<body><h1>WeFlow Archive</h1>
<p>WeFlow Archive 是个人使用的微信聊天归档工具。它在用户自己的设备上整理聊天记录，并使用 Google 服务将每日归档发送到用户自己的邮箱，以及将归档中的普通文件保存到用户的 Google 云端硬盘。</p>
<p>工具使用 Gmail 发送归档邮件和查询归档发送状态，使用 Google Drive 创建和查找由工具管理的归档文件。Google 账户访问需要用户授权。</p>
